<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Vivesh Yadav</title>
  <!--
    Lowercase vy as stroked polylines, not glyphs — a font-based favicon
    resolves to a different typeface on every OS. Sized to an x-height
    with the y descending below the baseline, so the pair reads as
    lowercase rather than small capitals.
  -->
  <rect width="64" height="64" rx="13" fill="#2f5c8f"/>
  <g fill="none" stroke="#f4f7f9" stroke-width="6" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M12 23 L20.5 42 L29 23"/>
    <path d="M35 23 L43 41"/>
    <path d="M52 23 L38 53"/>
  </g>
</svg>

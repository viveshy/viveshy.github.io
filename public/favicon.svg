<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Vivesh Yadav</title>
  <!--
    The V is a filled path rather than a glyph. A glyph favicon renders in
    whatever font the OS resolves for system-ui, so it looked different on
    every platform; a path is identical everywhere and stays crisp at 16px.
    Flat-cut terminals to match Space Grotesk.
  -->
  <rect width="64" height="64" rx="13" fill="#2f5c8f"/>
  <path d="M15 16 h10 l7 20 l7 -20 h10 l-13 32 h-8 z" fill="#f4f7f9"/>
</svg>

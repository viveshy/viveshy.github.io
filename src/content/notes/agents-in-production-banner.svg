<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t">
  <title id="t">The context window empties every turn; memory is only what something deliberately wrote down</title>
  <!--
    Drawn for this note. Its central claim is that a context window is
    working memory that evaporates each turn, and memory is what survives —
    so the top row resets at every turn while the bottom row accumulates.
    The gap between them is where "the agent forgot" bugs actually live.
  -->
  <rect width="720" height="360" fill="#eef2f6"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="60" y="60" font-size="14" fill="#8a97a5" font-family="ui-monospace, monospace">CONTEXT WINDOW · CLEARED EACH TURN</text>
    <g>
      <rect x="60" y="76" width="140" height="60" rx="4" fill="none" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 5"/>
      <text x="130" y="112" font-size="15" fill="#7d8a99" text-anchor="middle">turn 1</text>
      <rect x="228" y="76" width="140" height="60" rx="4" fill="none" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 5"/>
      <text x="298" y="112" font-size="15" fill="#7d8a99" text-anchor="middle">turn 2</text>
      <rect x="396" y="76" width="140" height="60" rx="4" fill="none" stroke="#8a97a5" stroke-width="2" stroke-dasharray="5 5"/>
      <text x="466" y="112" font-size="15" fill="#7d8a99" text-anchor="middle">turn 3</text>
      <text x="588" y="112" font-size="26" fill="#b4bfcb">⤫</text>
      <text x="628" y="112" font-size="14" fill="#8a97a5">gone</text>
    </g>

    <!-- Nothing crosses from the top row to the bottom unless it is written. -->
    <path d="M130 148 v44 M298 148 v44 M466 148 v44" stroke="#b4bfcb" stroke-width="2" stroke-dasharray="4 6"/>
    <text x="298" y="176" font-size="13" fill="#8a97a5" text-anchor="middle">only if something writes it down</text>

    <text x="60" y="228" font-size="14" fill="#8a97a5" font-family="ui-monospace, monospace">MEMORY · WHAT SURVIVES THE TURN</text>
    <rect x="60" y="244" width="600" height="66" rx="4" fill="#2f5c8f"/>
    <text x="84" y="285" font-size="19" fill="#eef2f6">durable store</text>
    <text x="636" y="285" font-size="15" fill="#c3d6ea" text-anchor="end">accumulates</text>
  </g>
</svg>

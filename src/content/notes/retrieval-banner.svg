<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t">
  <title id="t">A relevant passage ranked fortieth may as well not have been retrieved at all</title>
  <!--
    Drawn for this note. Its first claim is that ranking beats recall past a
    certain context length: a passage at position forty is retrieved but
    never read. So the top three are solid, the tail fades, and the one that
    matters is stranded at the bottom.
  -->
  <rect width="720" height="360" fill="#eef2f6"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="80" y="62" font-size="14" fill="#8a97a5" font-family="ui-monospace, monospace">RANKED RESULTS</text>

    <!-- Read: the top of the list. -->
    <g>
      <rect x="80" y="80" width="420" height="34" rx="3" fill="#2f5c8f"/>
      <text x="98" y="103" font-size="15" fill="#eef2f6" font-family="ui-monospace, monospace">1</text>
      <rect x="80" y="122" width="360" height="34" rx="3" fill="#5b7ea6"/>
      <text x="98" y="145" font-size="15" fill="#eef2f6" font-family="ui-monospace, monospace">2</text>
      <rect x="80" y="164" width="300" height="34" rx="3" fill="#8aa4c0"/>
      <text x="98" y="187" font-size="15" fill="#eef2f6" font-family="ui-monospace, monospace">3</text>
    </g>
    <text x="524" y="103" font-size="15" fill="#4a5563">read</text>

    <!-- The tail nobody reaches. -->
    <g fill="#cdd6e0">
      <rect x="80" y="206" width="220" height="34" rx="3"/>
      <rect x="80" y="248" width="180" height="34" rx="3"/>
    </g>
    <text x="98" y="229" font-size="15" fill="#8a97a5" font-family="ui-monospace, monospace">…</text>

    <!-- The one that actually mattered. -->
    <rect x="80" y="290" width="260" height="34" rx="3" fill="none" stroke="#b5501c" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="98" y="313" font-size="15" fill="#b5501c" font-family="ui-monospace, monospace">40</text>
    <text x="360" y="313" font-size="15" fill="#b5501c">the passage you needed</text>
  </g>
</svg>

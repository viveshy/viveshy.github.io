<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t">
  <title id="t">Stability is table stakes, velocity keeps you moving, maturity is the differentiator</title>
  <!--
    Drawn for this piece. Three tiers because that is the argument: each
    rests on the one below it, and only the top one differentiates — so
    only the top one carries the accent.
  -->
  <rect width="720" height="360" fill="#eef2f6"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="90" y="248" width="540" height="66" rx="4" fill="none" stroke="#8a97a5" stroke-width="2.5"/>
    <text x="116" y="288" font-size="25" fill="#4a5563">Stability</text>
    <text x="604" y="288" font-size="15" fill="#8a97a5" text-anchor="end">table stakes</text>

    <rect x="130" y="164" width="460" height="66" rx="4" fill="none" stroke="#69788a" stroke-width="2.5"/>
    <text x="156" y="204" font-size="25" fill="#3c4653">Velocity</text>
    <text x="564" y="204" font-size="15" fill="#8a97a5" text-anchor="end">keeps you moving</text>

    <rect x="170" y="80" width="380" height="66" rx="4" fill="#2f5c8f"/>
    <text x="196" y="120" font-size="25" fill="#eef2f6">Maturity</text>
    <text x="524" y="120" font-size="15" fill="#c3d6ea" text-anchor="end">the differentiator</text>
  </g>
</svg>

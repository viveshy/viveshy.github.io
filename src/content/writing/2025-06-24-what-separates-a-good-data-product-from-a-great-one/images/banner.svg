<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t">
  <title id="t">Three tiers stacked: stability is table stakes, velocity keeps you moving, and only maturity differentiates</title>
  <!--
    Built to read at both sizes. The list thumbnail is 104x68 with
    object-fit: cover, so only x 85-635 survives and it scales down about
    7x. The motif is large filled shapes inside that band; the small text
    is a bonus at full width, never the point. Every fill clears 3:1 on
    this background and carries text at 4.5:1 or better.
  -->
  <rect width="720" height="360" fill="#eef2f6"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="150" y="296" width="420" height="72" rx="6" fill="#c3d6ea"/>
    <text x="176" y="342" font-size="30" fill="#26364a">Stability</text>
    <text x="544" y="341" font-size="17" fill="#26364a" opacity="0.8" text-anchor="end">table stakes</text>
    <rect x="150" y="208" width="420" height="72" rx="6" fill="#2f5c8f"/>
    <text x="176" y="254" font-size="30" fill="#eef2f6">Velocity</text>
    <text x="544" y="253" font-size="17" fill="#eef2f6" opacity="0.8" text-anchor="end">keeps you moving</text>
    <rect x="150" y="120" width="420" height="72" rx="6" fill="#0e7c66"/>
    <text x="176" y="166" font-size="30" fill="#eef2f6">Maturity</text>
    <text x="544" y="165" font-size="17" fill="#eef2f6" opacity="0.8" text-anchor="end">the differentiator</text>
    <text x="360" y="86" font-size="20" fill="#7d8a99" text-anchor="middle">each tier rests on the one below it</text>
  </g>
</svg>

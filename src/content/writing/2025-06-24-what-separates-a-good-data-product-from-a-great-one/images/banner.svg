<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t">
  <title id="t">Three tiers stacked: stability is table stakes, velocity keeps you moving, and only maturity differentiates</title>
  <!--
    Treated as a cover: paper ground with a faint dot grid, one serif line,
    hairline rules. Only the tier that differentiates is filled, and the
    fills carry it at the 104x68 list thumbnail where the labels cannot.
  -->
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#1d2b3a" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="720" height="360" fill="#eef2f6"/>
  <rect width="720" height="360" fill="url(#dots)"/>
  <g>
    <text x="118" y="70" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="30" fill="#1d2b3a" font-style="italic">good, then great</text>
    <rect x="118" y="86" width="494" height="1" fill="#cfd9e4"/>
    <rect x="118" y="112" width="494" height="56" rx="2" fill="#2f5c8f"/>
    <text x="140" y="148" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="22" fill="#ffffff" letter-spacing="2">MATURITY</text>
    <text x="590" y="147" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="17" fill="#ffffff" opacity="0.75" text-anchor="end" font-style="italic">the differentiator</text>
    <rect x="118" y="192" width="494" height="56" rx="2" fill="#ffffff" stroke="#cfd9e4" stroke-width="1.5"/>
    <text x="140" y="228" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="22" fill="#5c6b7a" letter-spacing="2">VELOCITY</text>
    <text x="590" y="227" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="17" fill="#5c6b7a" opacity="0.75" text-anchor="end" font-style="italic">keeps you moving</text>
    <rect x="118" y="272" width="494" height="56" rx="2" fill="#ffffff" stroke="#cfd9e4" stroke-width="1.5"/>
    <text x="140" y="308" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="22" fill="#5c6b7a" letter-spacing="2">STABILITY</text>
    <text x="590" y="307" font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif" font-size="17" fill="#5c6b7a" opacity="0.75" text-anchor="end" font-style="italic">table stakes</text>
  </g>
</svg>

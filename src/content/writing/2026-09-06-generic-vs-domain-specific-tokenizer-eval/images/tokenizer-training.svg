<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 342" width="740" height="342" role="img" aria-labelledby="t2 d2">
  <title id="t2">What tokenizer training takes in and gives back</title>
  <desc id="d2">Training takes a corpus and a vocabulary size, and gives back a vocabulary of tokens plus the rules for splitting text. Words common in the corpus, like the and patient, become one token each. A rare word like glomerulonephritis is split into five tokens.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="var(--ink-soft, #586470)"/></marker></defs>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="1" y="1" width="738" height="340" rx="8" fill="none" stroke="var(--ink-soft, #586470)" stroke-width="1.5"/>
  <text x="20" y="34" fill="var(--ink-soft, #586470)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">TRAINING</text>
  <rect x="20" y="46" width="190" height="54" rx="4" fill="none" stroke="var(--border, #ccd6de)" stroke-width="1.5"/>
  <text x="115.0" y="74.0" fill="currentColor" font-size="13" text-anchor="middle" font-weight="400">corpus</text>
  <text x="115.0" y="90.0" fill="var(--ink-soft, #586470)" font-size="11.5" text-anchor="middle">a pile of text</text>
  <rect x="20" y="116" width="190" height="54" rx="4" fill="none" stroke="var(--border, #ccd6de)" stroke-width="1.5"/>
  <text x="115.0" y="144.0" fill="currentColor" font-size="13" text-anchor="middle" font-weight="400">vocabulary size</text>
  <text x="115.0" y="160.0" fill="var(--ink-soft, #586470)" font-size="11.5" text-anchor="middle">e.g. 16,000</text>
  <rect x="275" y="80" width="190" height="54" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="370.0" y="112.0" fill="currentColor" font-size="14" text-anchor="middle" font-weight="600">TOKENIZER TRAINING</text>
  <rect x="530" y="46" width="190" height="54" rx="4" fill="none" stroke="var(--border, #ccd6de)" stroke-width="1.5"/>
  <text x="625.0" y="74.0" fill="currentColor" font-size="13" text-anchor="middle" font-weight="400">vocabulary</text>
  <text x="625.0" y="90.0" fill="var(--ink-soft, #586470)" font-size="11.5" text-anchor="middle">16,000 tokens</text>
  <rect x="530" y="116" width="190" height="54" rx="4" fill="none" stroke="var(--border, #ccd6de)" stroke-width="1.5"/>
  <text x="625.0" y="148.0" fill="currentColor" font-size="13" text-anchor="middle" font-weight="400">splitting rules</text>
  <path d="M210 73.0 L234 73.0 L234 107.0" fill="none" stroke="var(--ink-soft, #586470)" stroke-width="1.5"/>
  <path d="M210 143.0 L234 143.0 L234 107.0" fill="none" stroke="var(--ink-soft, #586470)" stroke-width="1.5"/>
  <path d="M234 107.0 L275 107.0" fill="none" stroke="var(--ink-soft, #586470)" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M465 107.0 L489 107.0" fill="none" stroke="var(--ink-soft, #586470)" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M489 107.0 L489 73.0 L530 73.0" fill="none" stroke="var(--ink-soft, #586470)" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M489 107.0 L489 143.0 L530 143.0" fill="none" stroke="var(--ink-soft, #586470)" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="20" y="214" fill="var(--ink-soft, #586470)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">WHAT THAT MEANS</text>
  <rect x="20" y="226" width="700" height="96" rx="4" fill="none" stroke="var(--border, #ccd6de)" stroke-width="1.5"/>
  <text x="40" y="254" fill="var(--ink-soft, #586470)" font-size="11.5">common in the corpus</text>
  <text x="210" y="254" fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">the</text>
  <text x="360" y="254" fill="var(--ink-soft, #586470)" font-size="12">&#8594;</text>
  <rect x="382.0" y="240" width="33.6" height="19" rx="3" fill="none" stroke="var(--accent, #2f5c8f)" stroke-width="1.2"/>
  <text x="398.8" y="254" fill="var(--accent, #2f5c8f)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" text-anchor="middle">the</text>
  <text x="427.6" y="254" fill="var(--ink-soft, #586470)" font-size="11.5">1 token</text>
  <text x="210" y="280" fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">patient</text>
  <text x="360" y="280" fill="var(--ink-soft, #586470)" font-size="12">&#8594;</text>
  <rect x="382.0" y="266" width="62.4" height="19" rx="3" fill="none" stroke="var(--accent, #2f5c8f)" stroke-width="1.2"/>
  <text x="413.2" y="280" fill="var(--accent, #2f5c8f)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" text-anchor="middle">patient</text>
  <text x="456.4" y="280" fill="var(--ink-soft, #586470)" font-size="11.5">1 token</text>
  <text x="40" y="312" fill="var(--ink-soft, #586470)" font-size="11.5">rare in the corpus</text>
  <text x="210" y="312" fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">glomerulonephritis</text>
  <text x="360" y="312" fill="var(--ink-soft, #586470)" font-size="12">&#8594;</text>
  <rect x="382.0" y="298" width="55.2" height="19" rx="3" fill="none" stroke="var(--accent, #2f5c8f)" stroke-width="1.2"/>
  <text x="409.6" y="312" fill="var(--accent, #2f5c8f)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" text-anchor="middle">glomer</text>
  <rect x="441.2" y="298" width="26.4" height="19" rx="3" fill="none" stroke="var(--accent, #2f5c8f)" stroke-width="1.2"/>
  <text x="454.4" y="312" fill="var(--accent, #2f5c8f)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" text-anchor="middle">ul</text>
  <rect x="471.6" y="298" width="33.6" height="19" rx="3" fill="none" stroke="var(--accent, #2f5c8f)" stroke-width="1.2"/>
  <text x="488.4" y="312" fill="var(--accent, #2f5c8f)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" text-anchor="middle">one</text>
  <rect x="509.2" y="298" width="26.4" height="19" rx="3" fill="none" stroke="var(--accent, #2f5c8f)" stroke-width="1.2"/>
  <text x="522.4" y="312" fill="var(--accent, #2f5c8f)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" text-anchor="middle">ph</text>
  <rect x="539.6" y="298" width="48.0" height="19" rx="3" fill="none" stroke="var(--accent, #2f5c8f)" stroke-width="1.2"/>
  <text x="563.6" y="312" fill="var(--accent, #2f5c8f)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" text-anchor="middle">ritis</text>
  <text x="599.6" y="312" fill="var(--ink-soft, #586470)" font-size="11.5">5 tokens</text>
  </g>
</svg>

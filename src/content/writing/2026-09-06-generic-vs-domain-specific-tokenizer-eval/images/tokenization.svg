<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 796" width="740" height="796" role="img" aria-labelledby="tt td">
  <title id="tt">From input text to the vectors an LLM reads</title>
  <desc id="td">Five stages. The input sentence goes into the tokenizer. The tokenizer splits it into nine tokens. Each token gets a token id. Each id selects one row of the embedding layer. The LLM takes all nine vectors together, compares every token with every other one, and predicts the next token.</desc>

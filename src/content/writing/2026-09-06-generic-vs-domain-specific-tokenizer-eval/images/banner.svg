<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t">
  <title id="t">A 16,000 token medical tokenizer needs fewer tokens per word of medical text than GPT-4's 100,277 token tokenizer</title>
  <!--
    Bar length is vocabulary size; the number beside it is fertility on medical
    text. The point is the mismatch, since the shortest bar carries the better
    number. Sized for the 104x68 list thumbnail, which keeps only x 85-635 and
    scales down about 7x, so the bars carry it and the text is a bonus.
  -->
  <rect width="720" height="360" fill="#eef2f6"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="150" y="72" font-size="18" fill="#7d8a99">vocabulary size</text>
    <text x="620" y="72" font-size="18" fill="#7d8a99" text-anchor="end">tokens per word</text>
    <text x="150" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#26364a">custom-med-bpe</text>
    <rect x="150" y="110" width="26" height="42" rx="4" fill="#2f5c8f"/>
    <text x="620" y="141" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#b8481a" text-anchor="end" font-weight="700">1.484</text>
    <text x="150" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#26364a">cl100k</text>
    <rect x="150" y="188" width="160" height="42" rx="4" fill="#c3d6ea"/>
    <text x="620" y="219" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#7d8a99" text-anchor="end" font-weight="400">1.496</text>
    <text x="150" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#26364a">o200k</text>
    <rect x="150" y="266" width="320" height="42" rx="4" fill="#c3d6ea"/>
    <text x="620" y="297" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#7d8a99" text-anchor="end" font-weight="400">1.467</text>
    <rect x="150" y="314" width="470" height="3" fill="#c3d6ea"/>
    <text x="150" y="348" font-size="19" fill="#26364a">A sixth of the vocabulary, and fewer tokens per word.</text>
  </g>
</svg>
